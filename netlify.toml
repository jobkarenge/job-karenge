[build]
  command = "npm run build"
  publish = "dist"

# If you prefer proxying API and Socket.IO traffic through Netlify instead of
# setting VITE_API_URL, uncomment the two redirect blocks below and replace
# <YOUR_BACKEND_ORIGIN> with your live Node/Express server origin
# (for example: https://job-karenge-api.onrender.com):
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://<YOUR_BACKEND_ORIGIN>/api/:splat"
#   status = 200
#   force = true
#
# [[redirects]]
#   from = "/socket.io/*"
#   to = "https://<YOUR_BACKEND_ORIGIN>/socket.io/:splat"
#   status = 200
#   force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
